<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19 октября — День лицеиста</title>
<meta name="description" content="День лицеиста: Императорский Царскосельский лицей, Пушкин, его друзья, традиции и знаменитые выпускники.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Скрытые SVG-шаблоны: виньетки, перо, фасад лицея -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Угловая виньетка -->
    <g id="vignette">
      <path d="M4 40 C4 18 18 4 40 4" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <path d="M9 40 C9 22 22 9 40 9" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <path d="M40 4 C28 8 20 14 16 22 C22 18 30 16 40 16" fill="currentColor" opacity="0.75"/>
      <circle cx="14" cy="14" r="1.8" fill="currentColor"/>
      <path d="M4 4 L4 12 M4 4 L12 4" stroke="currentColor" stroke-width="1.6" fill="none"/>
    </g>

    <!-- Перо (водяной знак) -->
    <g id="quill">
      <path d="M30 172 C58 130 92 74 156 22 C132 66 112 96 86 124 C66 145 46 160 30 172 Z" fill="currentColor"/>
      <path d="M156 22 C120 54 84 96 52 148" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
      <path d="M118 52 C110 68 98 82 84 94 M96 82 C90 96 80 108 68 118 M134 38 C128 52 118 64 106 74" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.4"/>
      <path d="M30 172 L18 188 L26 180 L34 186 Z" fill="currentColor"/>
    </g>

    <!-- Фасад лицея -->
    <g id="lyceum-facade">
      <rect x="14" y="26" width="72" height="34" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 26 L50 8 L92 26 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 60 L92 60" stroke="currentColor" stroke-width="1.6"/>
      <rect x="22" y="34" width="6" height="12" fill="currentColor" opacity="0.8"/>
      <rect x="38" y="34" width="6" height="12" fill="currentColor" opacity="0.8"/>
      <rect x="56" y="34" width="6" height="12" fill="currentColor" opacity="0.8"/>
      <rect x="72" y="34" width="6" height="12" fill="currentColor" opacity="0.8"/>
      <rect x="45" y="44" width="10" height="16" fill="currentColor" opacity="0.9"/>
      <path d="M50 8 L50 2 M47 5 L53 5" stroke="currentColor" stroke-width="1"/>
      <circle cx="50" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <path d="M4 64 L96 64" stroke="currentColor" stroke-width="0.7" opacity="0.6"/>
      <path d="M4 66 L96 66" stroke="currentColor" stroke-width="0.4" opacity="0.4"/>
    </g>

    <!-- Орнамент-разделитель -->
    <g id="ornament">
      <path d="M0 6 L44 6" stroke="currentColor" stroke-width="0.8"/>
      <path d="M76 6 L120 6" stroke="currentColor" stroke-width="0.8"/>
      <path d="M60 0 L66 6 L60 12 L54 6 Z" fill="currentColor"/>
      <circle cx="48" cy="6" r="1.4" fill="currentColor"/>
      <circle cx="72" cy="6" r="1.4" fill="currentColor"/>
    </g>
  </defs>
</svg>

<main class="sheet-wrap">
  <article class="sheet" id="sheet">

    <!-- Угловые виньетки -->
    <svg class="corner corner--tl" viewBox="0 0 44 44" aria-hidden="true"><use href="#vignette"/></svg>
    <svg class="corner corner--tr" viewBox="0 0 44 44" aria-hidden="true"><use href="#vignette"/></svg>
    <svg class="corner corner--bl" viewBox="0 0 44 44" aria-hidden="true"><use href="#vignette"/></svg>
    <svg class="corner corner--br" viewBox="0 0 44 44" aria-hidden="true"><use href="#vignette"/></svg>

    <!-- Водяной знак: перо -->
    <svg class="watermark-quill" viewBox="0 0 180 192" aria-hidden="true"><use href="#quill"/></svg>

    <header class="masthead">
      <p class="masthead__kicker">Императорский Царскосельский лицей</p>
      <svg class="facade" viewBox="0 0 100 68" aria-hidden="true"><use href="#lyceum-facade"/></svg>
    </header>

    <section class="block" id="block" aria-live="polite">
      <!-- Содержимое рендерит app.js -->
    </section>

    <footer class="colophon">
      <svg class="ornament" viewBox="0 0 120 12" aria-hidden="true"><use href="#ornament"/></svg>
      <p class="colophon__text">Памяти первого выпуска · 1811 — 1817</p>
    </footer>

  </article>
</main>

<script src="blocks.js"></script>
<script src="app.js"></script>
</body>
</html>
